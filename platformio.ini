; PlatformIO Project Configuration File for ESP32Kiln
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-wrover
data_dir = data

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -fpermissive
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
    mathieucarbou/AsyncTCP @ ^3.3.2
    olikraus/U8g2 @ ^2.36.18
    br3ttb/PID @ ^1.2.1
    https://github.com/t0mpr1c3/Arduino-PID-AutoTune-Library.git
    arcao/Syslog @ ^2.0.1
    adafruit/MAX6675 library @ ^1.1.2
    adafruit/RTClib @ ^2.1.4
    https://github.com/Saur0o0n/MAX31855.git
    openenergymonitor/EmonLib @ ^1.1.0

; Target: TTGO / Generic ESP32-Wrover board (8MB flash + PSRAM) - Recommended default
[env:esp32-wrover]
board = esp-wrover-kit
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Target: ESP32-Wrover via ArduinoOTA over WiFi
[env:esp32-wrover-ota]
extends = env:esp32-wrover
upload_protocol = espota
upload_port = esp32kiln.local
; upload_flags = --auth=hotashell

; Target: Generic ESP32 Dev Module (4MB flash, no OTA, maximum flash for app + SPIFFS)
[env:esp32-dev-4mb]
board = esp32dev
board_build.partitions = partitions_4MB.csv
build_flags =
    ${env.build_flags}

; Target: Generic ESP32 Dev Module (4MB flash with dual OTA partitions + SPIFFS)
[env:esp32-dev-4mb-ota]
board = esp32dev
board_build.partitions = partitions_4MB_ota.csv
upload_protocol = espota
upload_port = esp32kiln.local
build_flags =
    ${env.build_flags}
; upload_flags = --auth=hotashell
